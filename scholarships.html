<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarships | New Step</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">New Step</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="universities.html">Universities</a></li>
                <li class="nav-item"><a class="nav-link active" href="scholarships.html">Scholarships</a></li>
                <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<section class="universities-section py-5">
    <div class="container">
        <div class="text-center mb-5">
            <h2 class="fw-bold">Explore Scholarships</h2>
            <p class="text-muted">Find scholarships that match your academic goals.</p>
        </div>

        <div class="row justify-content-center mb-4">
            <div class="col-lg-8">
                <input type="text" class="form-control search-input" id="searchInput" placeholder="Search scholarship...">
            </div>
        </div>

        <div class="row g-3 mb-5">
            <div class="col-md-6">
                <select class="form-select" id="countryFilter">
                    <option value="all" selected>All Countries</option>
                    <option value="European Union">European Union</option>
                    <option value="Canada">Canada</option>
                    <option value="France">France</option>
                    <option value="Netherlands">Netherlands</option>
                    <option value="Hungary">Hungary</option>
                    <option value="South Korea">South Korea</option>
                    <option value="Saudi Arabia">Saudi Arabia</option>
                    <option value="Italy">Italy</option>
                    <option value="Egypt">Egypt</option>
                </select>
            </div>
            <div class="col-md-6">
                <select class="form-select" id="fundingFilter">
                    <option value="all">All Funding</option>
                    <option value="Fully Funded">Fully Funded</option>
                    <option value="Partially Funded">Partially Funded</option>
                </select>
            </div>
        </div>

        <div class="row" id="scholarshipsContainer"></div>
    </div>
</section>

<div class="modal fade" id="scholarshipModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <img id="modalImage" class="img-fluid rounded mb-3" alt="Scholarship">
                <p id="modalCountry"></p>
                <p id="modalFunding"></p>
                <p id="modalDegree"></p>
                <p id="modalDeadline"></p>
                <p id="modalDescription"></p>
                <a id="modalWebsite" class="btn btn-success" target="_blank">Visit Official Website</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/scholarships.js"></script>
</body>
</html>
