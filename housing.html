<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Housing</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="housing.css">

</head>

<body>

<div class="container py-5">

    <h1 class="text-center mb-5">
         Student Housing
    </h1>

    <!-- Search -->

    <div class="row mb-4">

        <div class="col-md-4">

            <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="Search Housing">

        </div>

        <div class="col-md-3">

            <select id="countryFilter" class="form-select">

                <option value="all">All Countries</option>

                <option>United Kingdom</option>

                <option>Ireland</option>

                <option>Canada</option>

                <option>Australia</option>

                <option>Netherlands</option>

            </select>

        </div>

        <div class="col-md-3">

            <select id="typeFilter" class="form-select">

                <option value="all">All Types</option>

                <option>Student Residence</option>

                <option>Apartment</option>

                <option>Hotel Residence</option>

            </select>

        </div>

        <div class="col-md-2">

            <select id="priceFilter" class="form-select">

                <option value="all">All Prices</option>

                <option>$700/month</option>

                <option>$750/month</option>

                <option>$800/month</option>

                <option>$850/month</option>

                <option>$900/month</option>

            </select>

        </div>

    </div>

    <!-- Cards -->

    <div class="row" id="housingContainer">

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="housing.js"></script>

</body>

</html>
