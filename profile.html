<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile | New Step</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<section class="profile-section">
    <div class="container">
        <div class="profile-card">
            <div class="text-center">
                <div class="profile-avatar"><i class="bi bi-person-fill"></i></div>
                <h2>Student Profile</h2>
                <p>Complete your information to get personalized recommendations.</p>
                <div class="progress mb-5">
                    <div class="progress-bar" id="profileProgress" style="width:0%;">0%</div>
                </div>
            </div>

            <form id="profileForm">
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="fullName" placeholder="Enter your full name">
                    </div>
                    <div class="col-md-6 mb-4">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" placeholder="Enter your email">
                    </div>
                    <div class="col-md-6 mb-4">
                        <label class="form-label">Age</label>
                        <input type="number" class="form-control" id="age" min="15" max="30" placeholder="Enter your age">
                    </div>
                    <div class="col-md-6 mb-4">
                        <label class="form-label">Governorate</label>
                        <select class="form-select" id="governorate">
                            <option selected disabled>Select your governorate</option>
                            <option>Cairo</option><option>Giza</option><option>Alexandria</option>
                            <option>Qalyubia</option><option>Dakahlia</option><option>Sharqia</option>
                            <option>Gharbia</option><option>Monufia</option><option>Beheira</option>
                            <option>Kafr El Sheikh</option><option>Damietta</option><option>Port Said</option>
                            <option>Ismailia</option><option>Suez</option><option>North Sinai</option>
                            <option>South Sinai</option><option>Fayoum</option><option>Beni Suef</option>
                            <option>Minya</option><option>Assiut</option><option>Sohag</option>
                            <option>Qena</option><option>Luxor</option><option>Aswan</option>
                            <option>Red Sea</option><option>New Valley</option><option>Matrouh</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label class="form-label">Country</label>
                        <select class="form-select" id="country">
                            <option selected disabled>Select a country</option>
                            <option>Egypt</option><option>United States</option><option>United Kingdom</option>
                            <option>Canada</option><option>Germany</option><option>France</option>
                            <option>Italy</option><option>Spain</option><option>Netherlands</option>
                            <option>Turkey</option><option>Saudi Arabia</option><option>United Arab Emirates</option>
                            <option>Qatar</option><option>Australia</option><option>Japan</option>
                            <option>South Korea</option><option>Malaysia</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label class="form-label">Certificate</label>
                        <select class="form-select" id="certificate">
                            <option selected disabled>Select your certificate</option>
                            <option>Thanaweya Amma</option><option>IGCSE</option><option>IB</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label class="form-label">Budget</label>
                        <select class="form-select" id="budget">
                            <option selected disabled>Select your budget</option>
                            <option>Low</option><option>Medium</option><option>High</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label class="form-label">Field of Interest</label>
                        <select class="form-select" id="field">
                            <option selected disabled>Select your field</option>
                            <option>Engineering</option><option>Medicine</option><option>Dentistry</option>
                            <option>Pharmacy</option><option>Computer Science</option><option>Artificial Intelligence</option>
                            <option>Business</option><option>Economics</option><option>Media</option>
                            <option>Law</option><option>Arts</option><option>Education</option>
                        </select>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <button type="button" id="saveProfile" class="btn btn-primary px-5">Save Profile</button>
                </div>

                <div id="successMessage" class="alert alert-success mt-4 d-none">
                    <i class="bi bi-check-circle-fill"></i>
                    Your profile has been saved successfully.
                </div>
            </form>
        </div>
    </div>
</section>
<script src="js/main.js"></script>
</body>
</html>
